<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Thám Tử Nhí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --bg: #fff6e6; --ink: #5a4636; --card: #ffffff; --line: #f0d9b5; --accent: #ff8a5b;
    --good: #43c56b; --bad: #ff6b6b; --star: #ffc400; --soft: #ffe9c7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; overflow: hidden; }
  button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------- home ---------- */
  #home { align-items: center; overflow-y: auto; padding: 24px 16px 40px; gap: 18px;
    background: radial-gradient(circle at 20% 10%, #fff 0, transparent 40%), var(--bg); }
  .logo { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
  .logo h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); font-weight: 900; letter-spacing: -.5px; color: #ff7a45; text-shadow: 3px 3px 0 #fff, 5px 5px 0 #ffd9a8; }
  .logo svg { width: clamp(60px, 11vw, 96px); height: auto; }
  .sub { margin: -6px 0 0; font-size: 18px; opacity: .8; text-align: center; }
  .bigplay { background: var(--accent); color: #fff; font-size: 28px; font-weight: 900; padding: 18px 44px; border-radius: 999px;
    box-shadow: 0 8px 0 #e0673a; transition: transform .1s; display: flex; align-items: center; gap: 12px; }
  .bigplay:active { transform: translateY(6px); box-shadow: 0 2px 0 #e0673a; }
  .stats { font-size: 20px; font-weight: 800; display: flex; gap: 18px; align-items: center; }
  .chapters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
  .chapters button { background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 15px; min-width: 88px; }
  .chapters button.sel { background: #ffe0b8; border-color: #ffb36b; }
  .chapters small { display: block; font-size: 12px; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 10px; width: 100%; max-width: 900px; }
  .lv { aspect-ratio: 1; border-radius: 18px; background: #fff; border: 3px solid var(--line); font-size: 20px; font-weight: 900; position: relative; }
  .lv.done { background: #fff4c9; border-color: #ffd36b; }
  .lv .st { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 11px; letter-spacing: -1px; color: var(--star); }
  .lv.cur { outline: 4px solid var(--accent); outline-offset: 2px; }
  .parent { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 15px; }
  .parent button { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 800; }

  /* ---------- play ---------- */
  #play { padding: 10px 14px 14px; gap: 10px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .round { width: 54px; height: 54px; border-radius: 50%; background: #fff; border: 3px solid var(--line); display: grid; place-items: center; flex: none; box-shadow: 0 4px 0 var(--line); }
  .round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .round svg { width: 28px; height: 28px; }
  .q { flex: 1; background: #fff; border: 3px solid var(--line); border-radius: 22px; padding: 8px 16px; font-size: clamp(18px, 2.6vw, 28px); font-weight: 900; line-height: 1.2; min-height: 54px; display: flex; align-items: center; gap: 10px; }
  .q .num { background: var(--soft); border-radius: 12px; padding: 2px 10px; font-size: .75em; flex: none; }
  .stage { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (min-aspect-ratio: 4/3) { .stage { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); grid-template-rows: 1fr; } }
  .scene { min-height: 0; display: grid; place-items: center; }
  .scene svg { display: block; border-radius: 26px; border: 4px solid #fff; box-shadow: 0 6px 0 var(--line), 0 10px 30px rgba(120, 80, 30, .12); background: #fff; }
  .choices { min-height: 0; min-width: 0; display: grid; gap: 12px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .scene, .pick, .q { min-width: 0; }
  @media (max-aspect-ratio: 4/3) { .choices.n4 { grid-auto-flow: row; grid-template-columns: 1fr 1fr; } #play { padding: 8px 10px 10px; } .round { width: 46px; height: 46px; } .stage { grid-template-rows: minmax(0, .8fr) minmax(0, 1.2fr); } }
  @media (min-aspect-ratio: 4/3) { .choices.n4 { grid-auto-flow: row; grid-template-columns: 1fr 1fr; grid-auto-columns: unset; } .choices.n3 { grid-auto-flow: row; grid-template-columns: 1fr; grid-auto-columns: unset; } .choices.n3 .pick svg { max-width: 60%; } }
  .pick { background: #fff; border: 4px solid var(--line); border-radius: 26px; min-height: 0; padding: 4px; position: relative; display: grid; place-items: center; box-shadow: 0 6px 0 var(--line); transition: transform .12s; overflow: hidden; }
  .pick:active { transform: scale(.97); }
  .pick svg { width: 100%; height: 100%; }
  .pick.wrong { animation: shake .45s; border-color: var(--bad); opacity: .45; box-shadow: 0 6px 0 #ffc2c2; }
  .pick.right { border-color: var(--good); box-shadow: 0 6px 0 #9be3b0, 0 0 0 8px rgba(67, 197, 107, .25); animation: pop .5s; }
  .pick .mark { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 900; }
  .pick.right .mark { background: var(--good); }
  .pick.wrong .mark { background: var(--bad); }
  .pick.hintglow { animation: glow 1.2s ease-in-out 3; }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-12px) } 40% { transform: translateX(10px) } 60% { transform: translateX(-8px) } 80% { transform: translateX(6px) } }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.08) } 100% { transform: scale(1) } }
  @keyframes glow { 50% { box-shadow: 0 6px 0 var(--line), 0 0 0 10px rgba(255, 196, 0, .55); } }

  .bubble { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%); background: #fff; border: 4px solid var(--good); border-radius: 28px; padding: 14px 18px 14px 24px; display: flex; align-items: center; gap: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .15); transition: transform .35s cubic-bezier(.3, 1.4, .5, 1); max-width: calc(100% - 32px); z-index: 5; }
  .bubble.on { transform: translate(-50%, 0); }
  .bubble .txt { font-size: clamp(18px, 2.4vw, 24px); font-weight: 900; }
  .bubble .txt small { display: block; font-size: .72em; font-weight: 800; opacity: .8; }
  .bubble .stars { color: var(--star); font-size: 30px; letter-spacing: 2px; white-space: nowrap; }
  .next { background: var(--good); color: #fff; width: 76px; height: 76px; border-radius: 50%; flex: none; display: grid; place-items: center; box-shadow: 0 6px 0 #2f9b52; animation: bounce 1.2s infinite; }
  .next svg { width: 40px; height: 40px; }
  @keyframes bounce { 50% { transform: scale(1.08) } }
  .hint { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: #fff3c4; border: 3px solid #ffd36b; padding: 10px 20px; border-radius: 20px; font-weight: 900; font-size: 20px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 4; text-align: center; max-width: calc(100% - 32px); }
  .hint.on { opacity: 1; }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

  /* ---------- start overlay (needed for audio on iOS) ---------- */
  #gate { position: fixed; inset: 0; background: rgba(255, 246, 230, .96); z-index: 10; display: none; place-items: center; }
  #gate.on { display: grid; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="globaldefs"></svg>

<section id="home" class="screen on">
  <div class="logo">
    <svg viewBox="0 0 100 100"><circle cx="42" cy="42" r="30" fill="#bfe6ff" stroke="#5a4636" stroke-width="7"/><circle cx="34" cy="34" r="8" fill="#fff"/><path d="M64 64 L88 88" stroke="#5a4636" stroke-width="13" stroke-linecap="round"/><path d="M64 64 L88 88" stroke="#ff8a5b" stroke-width="7" stroke-linecap="round"/></svg>
    <h1>Thám Tử Nhí</h1>
  </div>
  <p class="sub">1000 câu đố quan sát cho bé 3 tuổi</p>
  <button class="bigplay" id="continue"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M7 4 L20 12 L7 20 Z" fill="#fff"/></svg><span>Chơi nào!</span></button>
  <div class="stats"><span id="starTotal">⭐ 0</span><span id="doneTotal">0 / 1000 bài</span></div>
  <div class="chapters" id="chapters"></div>
  <div class="grid" id="grid"></div>
  <div class="parent">
    <button id="toggleVoice">🔊 Đọc câu hỏi: Bật</button>
    <button id="reset">Xoá tiến độ</button>
  </div>
</section>

<section id="play" class="screen">
  <div class="top">
    <button class="round" id="homeBtn" aria-label="Về trang chủ"><svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 M6 9 V20 H18 V9" fill="none" stroke="#5a4636" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="q"><span class="num" id="num">1</span><span id="qtext"></span></div>
    <button class="round" id="speak" aria-label="Đọc lại"><svg viewBox="0 0 24 24"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="#ff8a5b" stroke="#5a4636" stroke-width="2" stroke-linejoin="round"/><path d="M16 9 Q18 12 16 15 M18.5 6.5 Q22 12 18.5 17.5" fill="none" stroke="#5a4636" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="stage">
    <div class="scene" id="scene"></div>
    <div class="choices" id="choices"></div>
  </div>
  <div class="hint" id="hint"></div>
  <div class="bubble" id="bubble">
    <div class="stars" id="bstars">⭐⭐⭐</div>
    <div class="txt"><span id="btitle">Giỏi quá!</span><small id="bexplain"></small></div>
    <button class="next" id="next" aria-label="Bài tiếp"><svg viewBox="0 0 24 24"><path d="M5 12 H19 M13 6 L19 12 L13 18" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</section>
<canvas id="fx"></canvas>

<script src="art.js"></script>
<script src="puzzles.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ALL = Puzzles.build(1000);
  const KEY = 'thamtunhi-v1';
  let st = { solved: {}, last: 1, voice: true };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  $('globaldefs').innerHTML = Art.defs().replace(/^<defs>|<\/defs>$/g, '');

  // ---------- voice ----------
  let viVoice = null;
  function pickVoice() {
    const vs = speechSynthesis.getVoices();
    viVoice = vs.find((v) => /vi[-_]VN/i.test(v.lang)) || vs.find((v) => /^vi/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text) {
    if (!st.voice || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; if (viVoice) u.voice = viVoice; u.rate = 0.9; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }

  // ---------- sounds ----------
  let ac;
  function tone(notes, type = 'sine', len = 0.14) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * len;
        o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len * 1.6);
        o.start(t); o.stop(t + len * 1.8);
      });
    } catch (e) {}
  }
  const sfx = { right: () => tone([523, 659, 784, 1046], 'triangle', 0.11), wrong: () => tone([330, 262], 'sine', 0.18), tap: () => tone([880], 'sine', 0.05) };

  // ---------- confetti ----------
  const cv = $('fx'), cx = cv.getContext('2d');
  let parts = [], raf = 0;
  function confetti() {
    cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    const cols = ['#ef5350', '#ffa040', '#ffd54f', '#66bb6a', '#42a5f5', '#ab7ae0', '#f48fb1'];
    for (let i = 0; i < 140; i++) parts.push({ x: cv.width / 2, y: cv.height * 0.55, vx: (Math.random() - 0.5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 8) * devicePixelRatio, r: (6 + Math.random() * 8) * devicePixelRatio, c: cols[i % 7], a: Math.random() * 6, s: Math.random() < 0.3 });
    if (!raf) loop();
  }
  function loop() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach((p) => {
      p.vy += 0.7 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= 0.985; p.a += 0.15;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
      if (p.s) { cx.beginPath(); for (let k = 0; k < 10; k++) { const rr = k % 2 ? p.r * 0.45 : p.r; cx.lineTo(Math.cos(k * Math.PI / 5) * rr, Math.sin(k * Math.PI / 5) * rr); } cx.fill(); }
      else cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
      cx.restore();
    });
    parts = parts.filter((p) => p.y < cv.height + 40);
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- home ----------
  let chapter = Math.floor((st.last - 1) / 50);
  function renderHome() {
    const solved = Object.keys(st.solved).length;
    const stars = Object.values(st.solved).reduce((a, b) => a + b, 0);
    $('starTotal').textContent = '⭐ ' + stars;
    $('doneTotal').textContent = solved + ' / 1000 bài';
    $('continue').querySelector('span').textContent = solved ? `Chơi tiếp — Bài ${st.last}` : 'Chơi nào!';
    $('toggleVoice').textContent = '🔊 Đọc câu hỏi: ' + (st.voice ? 'Bật' : 'Tắt');
    let ch = '';
    for (let c = 0; c < 20; c++) {
      const a = c * 50 + 1, b = a + 49;
      let d = 0; for (let i = a; i <= b; i++) if (st.solved[i]) d++;
      ch += `<button data-ch="${c}" class="${c === chapter ? 'sel' : ''}">${a}–${b}<small>${d ? '⭐ ' + d + '/50' : ['Dễ', 'Dễ', 'Dễ', 'Dễ', 'Vừa', 'Vừa', 'Vừa', 'Vừa', 'Vừa', 'Vừa', 'Khó', 'Khó', 'Khó', 'Khó', 'Khó', 'Khó', 'Siêu khó', 'Siêu khó', 'Siêu khó', 'Siêu khó'][c]}</small></button>`;
    }
    $('chapters').innerHTML = ch;
    let g = '';
    for (let i = chapter * 50 + 1; i <= chapter * 50 + 50; i++) {
      const s = st.solved[i];
      g += `<button class="lv ${s ? 'done' : ''} ${i === st.last ? 'cur' : ''}" data-lv="${i}">${i}${s ? `<span class="st">${'★'.repeat(s)}</span>` : ''}</button>`;
    }
    $('grid').innerHTML = g;
  }
  $('chapters').onclick = (e) => { const b = e.target.closest('[data-ch]'); if (b) { chapter = +b.dataset.ch; sfx.tap(); renderHome(); } };
  $('grid').onclick = (e) => { const b = e.target.closest('[data-lv]'); if (b) start(+b.dataset.lv); };
  $('continue').onclick = () => start(st.last);
  $('toggleVoice').onclick = () => { st.voice = !st.voice; save(); renderHome(); };
  $('reset').onclick = () => { if ($('reset').dataset.armed) { st = { solved: {}, last: 1, voice: st.voice }; save(); chapter = 0; renderHome(); delete $('reset').dataset.armed; $('reset').textContent = 'Xoá tiến độ'; } else { $('reset').dataset.armed = 1; $('reset').textContent = 'Bấm lần nữa để xoá'; setTimeout(() => { delete $('reset').dataset.armed; $('reset').textContent = 'Xoá tiến độ'; }, 3000); } };

  // ---------- play ----------
  let cur = null, misses = 0, locked = false;
  function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); }
  function start(id) {
    id = Math.max(1, Math.min(1000, id));
    cur = ALL[id - 1]; misses = 0; locked = false;
    st.last = id; save();
    show('play');
    $('bubble').classList.remove('on'); $('hint').classList.remove('on');
    $('num').textContent = id;
    $('qtext').textContent = cur.question;
    $('scene').innerHTML = Puzzles.sceneSVG(cur, ' preserveAspectRatio="xMidYMid meet"').replace(/<defs>[\s\S]*?<\/defs>/, '');
    const box = $('choices');
    box.className = 'choices n' + cur.choices.length;
    box.innerHTML = cur.choices.map((c, i) =>
      `<button class="pick" data-i="${i}" aria-label="${Art.SPECIES[c.sp].name}"><svg viewBox="-28 -45 256 295" preserveAspectRatio="xMidYMid meet">${Art.character(c)}</svg><span class="mark"></span></button>`).join('');
    fitScene();
    setTimeout(() => say(cur.question), 250);
  }
  $('choices').onclick = (e) => {
    const b = e.target.closest('.pick'); if (!b || locked || b.classList.contains('wrong')) return;
    const i = +b.dataset.i;
    if (i === cur.answer) {
      locked = true;
      b.classList.add('right'); b.querySelector('.mark').textContent = '✓';
      const stars = misses === 0 ? 3 : misses === 1 ? 2 : 1;
      st.solved[cur.id] = Math.max(st.solved[cur.id] || 0, stars);
      st.last = Math.min(1000, cur.id + 1); save();
      sfx.right(); confetti();
      const titles = ['Giỏi quá!', 'Đúng rồi!', 'Tuyệt vời!', 'Thám tử giỏi!', 'Hoan hô!'];
      const t = titles[cur.id % titles.length];
      $('btitle').textContent = t; $('bexplain').textContent = cur.explain;
      $('bstars').textContent = '⭐'.repeat(stars);
      $('hint').classList.remove('on');
      setTimeout(() => $('bubble').classList.add('on'), 450);
      say(t + ' ' + cur.explain);
    } else {
      misses++;
      b.classList.add('wrong'); b.querySelector('.mark').textContent = '✕';
      sfx.wrong();
      $('hint').textContent = misses >= 2 ? '💡 ' + cur.hint : 'Chưa đúng rồi, thử lại nhé!';
      $('hint').classList.add('on');
      say(misses >= 2 ? cur.hint : 'Chưa đúng rồi, con thử lại nhé!');
      if (misses >= 3) document.querySelector(`.pick[data-i="${cur.answer}"]`).classList.add('hintglow');
    }
  };
  function fitScene() {
    const box = $('scene'), svg = box.querySelector('svg'); if (!svg) return;
    const w = box.clientWidth, h = box.clientHeight, W = Math.min(w, h * 16 / 9);
    svg.style.width = W + 'px'; svg.style.height = W * 9 / 16 + 'px';
  }
  addEventListener('resize', fitScene);
  $('next').onclick = () => { sfx.tap(); start(cur.id + 1); };
  $('speak').onclick = () => say(cur.question);
  $('homeBtn').onclick = () => { speechSynthesis && speechSynthesis.cancel(); chapter = Math.floor((st.last - 1) / 50); renderHome(); show('home'); };

  renderHome();
  const m = location.hash.match(/^#(\d+)$/); if (m) start(+m[1]);
})();
</script>
</body>
</html>
